<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SleepWise</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>SleepWise 🌙</h1>

        <p class="description">
            زمان خواب یا بیداری خود را وارد کنید
            تا زمان مناسب را محاسبه کنیم.
        </p>

        <div class="mode-selection">

            <button id="sleepMode">
                زمان خواب را می‌دانم
            </button>

            <button id="wakeMode">
                زمان بیداری را می‌دانم
            </button>

        </div>

        <div class="time-section">

            <label for="timeInput">
                زمان را وارد کنید:
            </label>

            <input
                type="time"
                id="timeInput"
            >

            <button id="calculateButton">
                محاسبه
            </button>

        </div>

        <div id="result" class="result">

          <div class="result-card">
             <h3>پیشنهاد ۷ ساعته</h3>
             <p>--:--</p>
          </div>

          <div class="result-card">
             <h3>پیشنهاد ۸ ساعته</h3>
             <p>--:--</p>
    </div>

</div>
    <script src="/static/script.js"></script>
</body>

</html>
